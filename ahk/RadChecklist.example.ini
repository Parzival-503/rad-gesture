;
; Copy this file to RadChecklist.ini next to RadChecklist.ahk and edit it.
; Do not commit RadChecklist.ini if you put a real key in it.

[api]
; Leave key blank to use the ANTHROPIC_API_KEY environment variable instead,
; which keeps the key out of this file entirely.
key=
base_url=https://api.anthropic.com/v1/messages
model=claude-opus-5
; low | medium | high | xhigh | max - higher is more thorough and slower.
effort=medium
max_tokens=4000

[behavior]
; 1 strips identifier lines before the report leaves the machine. See the
; README - this reduces risk, it does not de-identify.
scrub_phi=1
; Hard cap on checklist length. Fewer is easier to actually use.
max_items=14
; ^ = Ctrl, ! = Alt, + = Shift, # = Win
hotkey_build=^!p
hotkey_toggle=^!o
