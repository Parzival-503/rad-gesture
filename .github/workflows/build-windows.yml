# RadGesture: checks + Windows installer.
#
# Runs on every push and refreshes the "radgesture-latest" release, so the
# installer always has the same direct link:
#   https://github.com/Parzival-503/rad-gesture/releases/download/radgesture-latest/RadGesture-Setup.exe
# The run's "RadGesture-Windows" artifact holds the same files.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Checks (tests + AutoHotkey checker)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Unit tests (ring geometry, menu, bridge, menu-to-helper cross-check)
        run: npm test
      - name: AutoHotkey helper static checks
        run: python3 tools/ahk_check.py helper/RadGestureHelper.ahk
      - name: Shortcut clash audit (all workstation scripts + ring buttons)
        run: python3 tools/hotkey_audit.py --check

  windows:
    name: Build Windows installer (x64)
    needs: checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Build installer + portable zip
        run: npm run dist
      - name: Upload the installer + portable zip
        uses: actions/upload-artifact@v7
        with:
          name: RadGesture-Windows
          path: |
            dist/RadGesture-Setup.exe
            dist/RadGesture-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the rolling "radgesture-latest" release (fixed download link)
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: radgesture-latest
          release_name: RadGesture (latest build)
          body: |
            Latest RadGesture hub. Download "RadGesture-Setup.exe" below and run it.
            Needs AutoHotkey v1.1 installed (it runs the helper).
          prerelease: true
          overwrite: true
          file: dist/RadGesture-Setup.exe
