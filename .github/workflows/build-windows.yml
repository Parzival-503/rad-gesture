# RadGesture: checks + Windows installer.
#
# Runs on every push. When it finishes, open the run on GitHub (Actions tab),
# download the "RadGesture-Windows" artifact, and run "RadGesture-Setup-....exe"
# inside it on the Windows PC. Pushes to main also refresh the "windows-dev"
# release, which gives a direct download link.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Checks (tests + AutoHotkey checker)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Unit tests (ring geometry, menu, bridge, menu-to-helper cross-check)
        run: npm test
      - name: AutoHotkey helper static checks
        run: python3 tools/ahk_check.py helper/RadGestureHelper.ahk

  windows:
    name: Build Windows installer (x64)
    needs: checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Build installer + portable zip
        run: npm run dist
      - name: Upload the installer + portable zip
        uses: actions/upload-artifact@v7
        with:
          name: RadGesture-Windows
          path: |
            dist/RadGesture-Setup-*.exe
            dist/RadGesture-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the rolling "windows-dev" release (main only)
        if: github.ref == 'refs/heads/main'
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: windows-dev
          release_name: RadGesture (Windows, latest build)
          body: |
            Latest RadGesture hub built from main. Download "RadGesture-Setup-....exe" below
            and run it. Needs AutoHotkey v1.1 installed for the helper.
          prerelease: true
          overwrite: true
          file_glob: true
          file: dist/RadGesture-Setup-*.exe
